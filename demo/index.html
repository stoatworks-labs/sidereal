  <body>
    <main id="demo">
      <noscript>
        <h1>Sidereal</h1>
        <p>
          An FFGL source and an effect that build space pictures the way NASA's
          are made: gas lit by the stars inside it, seen through Hubble's and
          Webb's real filters, each filter's grey image given the colour its
          release gave it. Fifteen famous targets from the Pillars of Creation
          to Webb's First Deep Field, seven generative skies, and meteors, a
          supernova and its light echo on a button. No photograph is shipped or
          sampled; the light is worked out.
        </p>
        <p>
          This demo runs the plugin's shaders and a port of its CPU half in your
          browser, so it needs JavaScript and WebGL2. The plugin itself, its
          source and its downloads are on
          <a href="https://github.com/stoatworks-labs/sidereal">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/sidereal/">Project page and downloads</a></li>

          <li><a href="https://github.com/stoatworks-labs/sidereal">Source on GitHub</a></li>
        </ul>
      </noscript>
